<!doctype html>
<html lang="cs">
<head>
<script src="../sync.js"></script>
<script src="../music.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>VESNIČKA · Windowling</title>
<meta name="theme-color" content="#4a3426">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>VESNIČKA potřebuje JavaScript.</noscript>
<div id="app">
  <header class="top">
    <a class="back" href="../../index.html" aria-label="Zpět do herního centra">‹</a>
    <div class="brand">VESNIČKA</div>
    <button class="season" id="season" type="button"></button>
    <button class="icon-btn" id="soundBtn" type="button"></button>
  </header>
  <section class="scene" id="sceneBox">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="coins"><svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f2c14e" stroke="#a8771e" stroke-width="1.6"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="#c9952e" stroke-width="1.2"/><path d="M9.5 9.5h5M12 9.5v6" stroke="#a8771e" stroke-width="1.8" stroke-linecap="round"/></svg><b id="coins">0</b></div>
      <div class="rate" id="rate"></div>
      <div class="buffs" id="buffs"></div>
    </div>
    <button class="edge left" id="edgeL" type="button" hidden></button>
    <button class="edge right" id="edgeR" type="button" hidden></button>
    <button class="news-btn" id="newsBtn" type="button" aria-expanded="false" aria-controls="news">🎁<span class="nl">Novinky</span><i class="dot" hidden></i></button>
    <div class="news" id="news" hidden></div>
    <button class="quick" id="quick" type="button" hidden></button>
    <div class="hint" id="hint">👆</div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </section>
  <section class="panel">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="body" id="body"></div>
  </section>
</div>
<div id="modal" class="modal" hidden></div>
<script src="js/data.js"></script>
<script src="js/econ.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="../presence.js"></script>
</body>
</html>
