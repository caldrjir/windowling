<html lang="cs">
<head>

<script src="../music.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOLLOW SUN</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="js/desktop-only.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<body>
<canvas id="gl"></canvas>
<div id="fx"></div>
<div id="drops"></div>
<div id="hud" hidden>
  <div id="bossbar" hidden><div class="bn"><b id="boss-n"></b><span id="boss-ph"></span></div><div class="bb"><i id="boss-fill"></i><em style="left:60%"></em><em style="left:25%"></em></div></div>
  <div id="topbar"><span id="wave"></span><span id="kills"></span><span id="gold" class="gold"></span><span id="fps" hidden></span><button id="b-inv" class="invbtn" type="button"></button></div>
  <canvas id="minimap" width="200" height="200" hidden></canvas>
  <div id="xpbar"><i id="b-xp"></i><span id="t-xp"></span></div>
  <div id="orbs">
    <div class="bar hp"><i id="b-hp"></i><span id="t-hp"></span></div>
    <div class="bar res"><i id="b-res"></i><span id="t-res"></span></div>
  </div>
  <div id="skills"></div>
  <div id="hint"></div>
</div>
<div id="assetPanel" hidden></div>
<div id="inv" hidden></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<div id="dialog" hidden><div class="who"></div><div class="txt"></div><div class="choices"></div><div class="hint"></div></div>
<div id="bark" hidden></div>
<div id="whisper" hidden><div class="wn"></div><div class="wt"></div><div class="ww"></div></div>
<div id="screen"></div>
<script src="vendor/playcanvas.min.js"></script>
<script src="vendor/meshopt_decoder.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>

<script src="js/game.js"></script>
<script src="../presence.js"></script>
