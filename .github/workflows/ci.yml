name: CI

# CI runs on pull requests (once per push) and by hand (workflow_dispatch, everything). Master
# does not repeat it after the merge: the PR already passed, and Deploy builds and deploys every
# push to master by itself.
#
# Minutes: every job is billed rounded up to a whole minute and pays its own setup (Postgres,
# install, build, Worker), so a PR normally runs ONE job: lint, types, unit + DB tests, the build
# and the E2E tests of the games it changes (apps/web/scripts/e2e-scope.mjs). Only a PR that
# touches shared code (the hub, shared game files, the puzzle kit, the Worker, packages, config)
# runs the whole E2E suite, in four parallel shards after that job.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling
  TEST_DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling_test
  # Placeholders so the build can validate config; never real secrets.
  BETTER_AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  BETTER_AUTH_URL: http://localhost:5173
  PUBLIC_APP_URL: http://localhost:5173

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      full: ${{ steps.scope.outputs.full }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # The PR's merge commit and its first parent (the base branch): their diff is the PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: E2E scope
        id: scope
        run: node apps/web/scripts/e2e-scope.mjs ${{ github.event_name == 'pull_request' && 'HEAD^1 HEAD' || '--full' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U windowling windowling_test
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are up to date with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/database/drizzle)" ]; then
            echo "::error::Drizzle schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/database/drizzle
            exit 1
          fi
      - name: Unit & integration tests
        run: pnpm test
      - name: Build (Cloudflare)
        run: pnpm build
      - name: Worker bundle dry run
        run: pnpm --filter @windowling/web exec wrangler deploy --dry-run --outdir dist-worker
      # Google Chrome is preinstalled on GitHub's Ubuntu runners: no browser download.
      - name: E2E of the changed games
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.tags != ''
        env:
          PLAYWRIGHT_CHANNEL: chrome
          E2E_TAGS: ${{ steps.scope.outputs.tags }}
          E2E_PREBUILT: '1'
        run: |
          pnpm db:migrate
          pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The whole suite, only when the PR touches shared code: four shards in parallel, each with its
  # own Postgres and Worker (~3 min instead of ~10).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    needs: quality
    if: needs.quality.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run E2E
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # The required E2E check. A job skipped by its `if` counts as passed, so a PR that only changes
  # games (its E2E ran inside the quality job) spends no minute here.
  e2e:
    name: E2E (Playwright on workerd)
    needs: [quality, e2e-shard]
    if: always() && needs.quality.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success
