name: CI

# CI runs on pull requests (once per push) and by hand (workflow_dispatch, everything). Master
# does not repeat it after the merge: the PR already passed, and Deploy builds and deploys every
# push to master by itself. E2E runs only the tests the PR can affect (job "E2E scope").
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling
  TEST_DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling_test
  # Placeholders so the build can validate config; never real secrets.
  BETTER_AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  BETTER_AUTH_URL: http://localhost:5173
  PUBLIC_APP_URL: http://localhost:5173

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are up to date with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/database/drizzle)" ]; then
            echo "::error::Drizzle schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/database/drizzle
            exit 1
          fi
      - name: Unit & integration tests
        run: pnpm test
      - name: Build (Cloudflare)
        run: pnpm build
      - name: Worker bundle dry run
        run: pnpm --filter @windowling/web exec wrangler deploy --dry-run --outdir dist-worker

  # Which tests the PR can affect (apps/web/scripts/e2e-scope.mjs): a PR that only changes games
  # runs their tagged tests plus the untagged ones (hub, sign-in, sync, APIs) in one shard;
  # anything else (shared game files, the puzzle kit, the hub, the Worker, config) runs all in four.
  scope:
    name: E2E scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      total: ${{ steps.scope.outputs.total }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      # The PR's merge commit and its first parent (the base branch): their diff is the PR.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        run: node apps/web/scripts/e2e-scope.mjs ${{ github.event_name == 'pull_request' && 'HEAD^1 HEAD' || '--full' }}

  # Shards in parallel, each with its own Postgres and Worker (all tests: four, ~3 min each).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ needs.scope.outputs.total }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      # Google Chrome is preinstalled on GitHub's Ubuntu runners: no browser download.
      - name: Run E2E
        env:
          PLAYWRIGHT_CHANNEL: chrome
          E2E_SKIP_TAGS: ${{ needs.scope.outputs.skip }}
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ needs.scope.outputs.total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # One check under the old name, so branch protection keeps requiring a single E2E result.
  e2e:
    name: E2E (Playwright on workerd)
    needs: [scope, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.scope.result }}" = success && test "${{ needs.e2e-shard.result }}" = success
