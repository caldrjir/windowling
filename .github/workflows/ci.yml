name: CI

# Pull requests run once (pull_request); master runs again on push because Deploy waits for
# that run. Pushing to a feature branch alone does not start CI - open a PR (or run it by hand).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling
  TEST_DATABASE_URL: postgres://windowling:windowling@localhost:5432/windowling_test
  # Placeholders so the build can validate config; never real secrets.
  BETTER_AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  BETTER_AUTH_URL: http://localhost:5173
  PUBLIC_APP_URL: http://localhost:5173

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are up to date with the schema
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/database/drizzle)" ]; then
            echo "::error::Drizzle schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/database/drizzle
            exit 1
          fi
      - name: Unit & integration tests
        run: pnpm test
      - name: Build (Cloudflare)
        run: pnpm build
      - name: Worker bundle dry run
        run: pnpm --filter @windowling/web exec wrangler deploy --dry-run --outdir dist-worker

  # Four shards in parallel, each with its own Postgres and Worker (~3 min instead of ~10).
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: windowling
          POSTGRES_PASSWORD: windowling
          POSTGRES_DB: windowling
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U windowling"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      # Google Chrome is preinstalled on GitHub's Ubuntu runners: no browser download.
      - name: Run E2E
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  # One check under the old name, so branch protection keeps requiring a single E2E result.
  e2e:
    name: E2E (Playwright on workerd)
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success
