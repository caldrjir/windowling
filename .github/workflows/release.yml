name: Release

# release-please reads Conventional Commits on master, keeps a release PR with
# the next SemVer version + CHANGELOG, and tags the release when it is merged.
# Once a week and by hand, not on every push to master: each run is a billed minute, and the
# release PR only needs to be current when a release is cut. To release: run it by hand, merge
# the release PR, run it by hand again (that run tags the release).
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
