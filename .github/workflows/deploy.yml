name: Deploy

# Production deploy after CI has passed on main.
# Inert until the repository has the CLOUDFLARE_API_TOKEN secret (see docs/development.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Migrate & deploy to windowling.com
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://windowling.com
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set - skipping deploy."
      - uses: actions/checkout@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Build
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          BETTER_AUTH_URL: https://windowling.com
          PUBLIC_APP_URL: https://windowling.com
        run: pnpm build
      - name: Deploy worker
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Smoke test
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://windowling.com/api/health && exit 0
            sleep 10
          done
          exit 1
