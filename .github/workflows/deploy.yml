name: Deploy

# Production deploy after CI has passed on master.
# Inert until the repository has the CLOUDFLARE_API_TOKEN secret (see docs/development.md).
# All production secrets live in the GitHub `production` environment; this workflow
# uploads them to the Worker together with each new version (single source of truth).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Manual re-deploy of the current master (e.g. after rotating a secret).
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Migrate & deploy to windowling.com
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://windowling.com
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set - skipping deploy."
      - uses: actions/checkout@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Build
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          BETTER_AUTH_URL: https://windowling.com
          PUBLIC_APP_URL: https://windowling.com
        run: pnpm build
      - name: Prepare worker secrets
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # Written as JSON (no shell/dotenv quoting pitfalls) to a private temp file; never printed.
        run: |
          umask 077
          node -e '
            const required = ["DATABASE_URL", "BETTER_AUTH_SECRET"];
            const missing = required.filter((k) => !process.env[k]);
            if (missing.length) {
              console.error("::error::Missing production secrets: " + missing.map((k) => k === "DATABASE_URL" ? "WORKER_DATABASE_URL" : k).join(", "));
              process.exit(1);
            }
            const secrets = Object.fromEntries(
              [...required, "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"]
                .filter((k) => process.env[k])
                .map((k) => [k, process.env[k]]),
            );
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(secrets));
          ' "$RUNNER_TEMP/worker-secrets.json"
      - name: Deploy worker
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Smoke test (with live Worker logs on failure)
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Stream the Worker's logs while probing, so a failure shows the real error.
          timeout 300 pnpm exec wrangler tail windowling --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 10
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' --max-time 40 https://windowling.com/api/health || echo 000)
            echo "attempt $i: HTTP $code $(head -c 300 "$RUNNER_TEMP/health.json" 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          sleep 5
          echo "::group::Worker logs and exceptions"
          node -e '
            const lines = require("node:fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            for (const line of lines) {
              try {
                const e = JSON.parse(line);
                for (const l of e.logs ?? []) console.log(`[${l.level}]`, JSON.stringify(l.message));
                for (const x of e.exceptions ?? []) console.log("[exception]", x.name, x.message);
              } catch {}
            }
          ' "$RUNNER_TEMP/tail.jsonl" || true
          cat "$RUNNER_TEMP/tail.err" || true
          echo "::endgroup::"
          exit 1
