name: PR title

# PRs are squash-merged, so the PR title becomes the commit on master.
# Enforcing Conventional Commits here keeps the changelog and versioning automatic.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # Dependabot rewrites its PR descriptions often and its titles are always conventional, so
    # its body-only edits skip the check (everyone else's edits run it).
    if: >-
      github.event.action != 'edited' || github.event.changes.title != null ||
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
